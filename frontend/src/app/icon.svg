<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Argus">
  <!--
    Mirrors the nav mark in components/top-nav.tsx: a `bg-primary` rounded
    square holding the origami bird in `primary-foreground`. Colours are the
    light-theme tokens from globals.css resolved to hex, since favicons can't
    read CSS custom properties or respond to the theme.
      --primary            oklch(0.5 0.108 151) -> #2A7442
      --primary-foreground oklch(0.98 0.012 95) -> #FBF9F0
    The stroke is heavier than the nav's 1.75 so the bird stays legible at 16px.
  -->
  <rect width="32" height="32" rx="6" fill="#2A7442" />
  <g
    transform="translate(6 5.2) scale(0.8333)"
    fill="none"
    stroke="#FBF9F0"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M3 7 L21 5 L13 13 L21 5 L17 19 L12 14 L8 21 L13 13 Z" />
  </g>
</svg>
